[build]
  command = "npm run build"
  publish = "dist"

# Required environment variables (set in Netlify's dashboard, not here):
#   PUBLIC_SANITY_PROJECT_ID
#   PUBLIC_SANITY_DATASET (typically "production")

# Optional (spec §8): PUBLIC_LIVE_WEATHER=on enables live weather/sea data in the
# home-page data egg. Leave unset until a commercial weather plan is chosen —
# Open-Meteo's free API is non-commercial only.

# Production only: an unreachable/unparseable Substack feed fails the build
# instead of publishing an empty Journal, so Netlify keeps the last good deploy.
# Deploy previews and local builds keep the warn + empty-fallback behaviour.
[context.production.environment]
  JOURNAL_FEED_REQUIRED = "true"

# Private client presentations (commissions, sold pieces) live in public/p/<slug>/.
# Unlisted links only: keep them out of search engines.
[[headers]]
  for = "/p/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Print checkout API (Stripe, Sanity orders dataset, Resend).
[functions]
  directory = "netlify/functions"
  # Certificate PDF fonts and brand images, read at runtime (see netlify/lib/certificate-pdf.ts).
  included_files = ["netlify/assets/**"]

# Collector order pages are reached by an unguessable token link only.
[[headers]]
  for = "/collector"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/collector/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
