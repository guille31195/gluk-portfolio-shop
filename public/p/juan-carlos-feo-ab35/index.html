*{box-sizing:border-box}
html,body{background:var(--color-black)}
body{color:var(--color-bone);font-family:var(--font-body);font-size:var(--text-body);line-height:1.6}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--color-bone);outline-offset:4px}
.label{font-size:var(--text-label);letter-spacing:.26em;text-transform:uppercase}
.mono{font-size:var(--text-label);letter-spacing:.12em;font-variant-numeric:tabular-nums}
.dim{opacity:.55}
.title{font-family:var(--font-display);font-weight:800;font-stretch:125%;font-size:var(--text-title);line-height:.95;letter-spacing:-.02em}
.statement{font-family:var(--font-display);font-weight:300;font-size:var(--text-statement);line-height:1.22;letter-spacing:-.01em}
.display{font-family:var(--font-display);font-weight:800;font-stretch:125%;font-size:var(--text-display);line-height:.8;letter-spacing:-.045em}
.display--outline{color:transparent;-webkit-text-stroke:max(1px,.012em) var(--color-bone)}
.hairline{display:block;height:var(--rule-hair);border:0;margin:0;background:var(--color-hairline)}
.rule{display:block;height:var(--rule-thin);background:var(--rule-img) center/100% 100% no-repeat}
.button{display:inline-block;padding:.9em 1.6em;border:1px solid var(--color-bone);background:none;font-size:var(--text-label);letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:background-color .4s var(--ease-out),color .4s var(--ease-out)}
.button:hover,.button:focus-visible{background:var(--color-bone);color:var(--color-black)}

.page{max-width:1440px;margin:0 auto;padding-inline:var(--gutter);padding-block:2rem var(--section-space);display:grid;gap:var(--section-space)}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-bottom:1.2rem;border-bottom:var(--rule-hair) solid var(--color-hairline)}
.top img{height:1.6rem;width:auto;display:block}
.top .right{display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap;justify-content:flex-end;text-align:right}

/* hero: painting + wall label, like the artwork page */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(2rem,6vw,6rem);align-items:start;margin-top:calc(-1 * var(--section-space) + 3rem)}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.painting{position:relative}
.painting img{display:block;width:100%;height:auto;box-shadow:var(--shadow-painting)}
.painting .replace{position:absolute;right:1rem;bottom:1rem;background:rgba(30,22,25,.7)}
.painting .empty{aspect-ratio:3/4;max-width:100%;border:1px dashed var(--color-hairline);display:grid;place-items:center;padding:2rem;text-align:center}
.painting.drag img,.painting.drag .empty{outline:1px dashed var(--color-bone);outline-offset:8px}
.wall{display:flex;flex-direction:column;gap:1.4rem;position:sticky;top:2rem}
.wall .rule{width:9rem}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:7rem 1fr;align-items:baseline;gap:1rem;padding:.55rem 0;border-top:var(--rule-hair) solid var(--color-hairline)}
.rows li:last-child{border-bottom:var(--rule-hair) solid var(--color-hairline)}
.rows input{width:100%;background:none;border:0;padding:0;font-variant-numeric:tabular-nums}
.rows input::placeholder{color:var(--color-bone-dim)}
.rows input:focus{outline:none;box-shadow:0 1px 0 var(--color-bone)}
.rows input:disabled{opacity:1}


/* brief */
.brief{display:grid}
.brief-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
.item{display:grid;grid-template-columns:minmax(9rem,1fr) minmax(0,3fr);gap:clamp(1rem,3vw,3rem);padding:2rem 0;border-top:var(--rule-hair) solid var(--color-hairline);align-items:start}
@media (max-width:860px){.item{grid-template-columns:1fr;gap:.9rem}}
.songs{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.25rem}
.songs li{display:flex;justify-content:space-between;gap:1rem}
.songs li span:last-child{opacity:.55}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.6rem;margin-top:1rem}
.swatch{display:grid;gap:.5rem}
.swatch b{display:block;aspect-ratio:1;border:1px solid var(--color-hairline)}
.swatches.small{grid-template-columns:repeat(8,minmax(0,1fr));gap:.35rem}
@media (max-width:560px){.swatches.small{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gauge{width:100%;max-width:22rem;margin-top:1rem;display:block}
.gauge text{font-family:var(--font-body)}

/* production */
.progress{position:relative;height:var(--rule-base);background:var(--color-hairline);margin-bottom:2rem}
.progress .rule{position:absolute;inset:0 auto 0 0;height:100%;background-size:var(--full) 100%;background-position:left center}
.steps{list-style:none;margin:0;padding:0}
.step{width:100%;display:grid;grid-template-columns:3rem 1fr auto;gap:1rem;align-items:baseline;padding:1rem 0;border:0;border-top:var(--rule-hair) solid var(--color-hairline);background:none;text-align:left;cursor:pointer}
.steps li:last-child .step{border-bottom:var(--rule-hair) solid var(--color-hairline)}
.step .name{font-family:var(--font-display);font-weight:300;font-size:clamp(1.1rem,.9rem + .8vw,1.6rem);line-height:1.2}
.step.done .name{opacity:.45;text-decoration:line-through;text-decoration-thickness:1px}
.step.now .name{font-weight:800}
.step .state{white-space:nowrap}
.step.now .state{color:var(--color-orange);opacity:1}
.step.done .state{color:var(--color-blue);opacity:1}
.step:hover .name{opacity:1}
.step[disabled]{cursor:default}

.notes textarea,.notes .ro{width:100%;min-height:10rem;background:none;border:var(--rule-hair) solid var(--color-hairline);padding:1rem;resize:vertical;white-space:pre-wrap}
.notes textarea:focus{outline:none;border-color:var(--color-bone)}
.readonly .edit-only{display:none!important}

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function today(){return new Date().toISOString().slice(0,10);}

  var SONGS = [
    ['Hans Zimmer','score'],
    ['Lovely Day','Bill Withers'],
    ['Free Bird','Lynyrd Skynyrd'],
    ['American Pie','Don McLean'],
    ['Pedro Navaja','Rubén Blades'],
    ['Sweet Disposition','The Temper Trap'],
    ['Lovelee Dae','Blockhead']
  ];
  // His five colors, matched to where they already live in the reference.
  var HIS = [
    ['Yellow','#C8934E','ochre wall'],
    ['Blue','#4D82BE','stripe'],
    ['Green','#277705','door'],
    ['White','#F1EEE8','bone'],
    ['Black','#1E1619','ink']
  ];
  // Sampled straight from the reference photo.
  var REF = ['#3F5771','#8799A6','#5D7788','#B5712E','#C8934E','#C2BAA9','#9B5A3C','#277705'];

  function gauge(){
    // 0–200 km/h dial. His answer: 85 mph = 136.8 km/h.
    var cx=170, cy=160, r=130;
    function pt(v,rad){var a=Math.PI*(1-v/200);return [cx+rad*Math.cos(a), cy-rad*Math.sin(a)];}
    var s='', i;
    for(i=0;i<=200;i+=10){
      var major=i%50===0, a=pt(i,r), b=pt(i,r-(major?14:7));
      s+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="#F1EEE8" stroke-opacity="'+(major?1:.35)+'" stroke-width="'+(major?1.5:1)+'"/>';
      if(major){var l=pt(i,r-30);s+='<text x="'+l[0].toFixed(1)+'" y="'+(l[1]+4).toFixed(1)+'" fill="#F1EEE8" fill-opacity=".55" font-size="11" text-anchor="middle">'+i+'</text>';}
    }
    [10,60,200].forEach(function(v){var p=pt(v,r+10);s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="#1E1619" stroke="#F1EEE8" stroke-opacity=".55"/>';});
    var e=pt(136.8,r), n=pt(136.8,r-20);
    return '<svg class="gauge" viewBox="0 0 340 196" role="img" aria-label="Speedometer at 137 km/h, 85 mph">'+
      '<path d="M40 160 A130 130 0 0 1 300 160" fill="none" stroke="#F1EEE8" stroke-opacity=".22" stroke-width="3"/>'+
      '<path d="M40 160 A130 130 0 0 1 '+e[0].toFixed(1)+' '+e[1].toFixed(1)+'" fill="none" stroke="#C34F05" stroke-width="3"/>'+s+
      '<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0].toFixed(1)+'" y2="'+n[1].toFixed(1)+'" stroke="#C34F05" stroke-width="2.5" stroke-linecap="round"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#C34F05"/>'+
      '<text x="'+cx+'" y="'+(cy+30)+'" fill="#F1EEE8" font-size="12" letter-spacing="1.5" text-anchor="middle">137 KM/H · 85 MPH</text></svg>';
  }

  function dueText(){
    if(!S.due) return '';
    var days=Math.ceil((new Date(S.due+'T23:59:59')-new Date())/864e5);
    if(days<0) return ' · past due';
    return ' · '+(days>13?Math.floor(days/7)+' weeks':days+' days')+' to deadline';
  }
  function currentStage(){for(var i=0;i<S.stages.length;i++) if(!S.stages[i].done) return S.stages[i]; return null;}

  function item(label, answer){
    return '<div class="item"><p class="label dim">'+label+'</p><div>'+answer+'</div></div>';
  }

  function render(){
    var done=S.stages.filter(function(s){return s.done;}).length, total=S.stages.length;
    var now=currentStage(), dis=writable?'':' disabled';
    root.className=writable?'':'readonly';
    root.innerHTML=
    '<div class="page">'+
      '<header class="top"><img src="'+WORDMARK+'" alt="GLUK">'+
        '<div class="right"><span class="mono dim" id="save"></span><span class="label">Commission · 2026</span></div></header>'+

      '<section class="hero">'+
        '<div class="painting" id="drop">'+
          (S.image
            ? '<img src="'+S.image+'" alt="The painting Juan Carlos chose as his reference for the aesthetic">'+
              '<button class="button replace edit-only" id="pick"'+dis+'>Replace</button>'
            : '<div class="empty"><div style="display:grid;gap:1rem;justify-items:center"><p class="label dim">Reference</p><button class="button edit-only" id="pick"'+dis+'>Add image</button></div></div>')+
          '<input type="file" id="file" accept="image/*" hidden>'+
        '</div>'+
        '<aside class="wall">'+
          '<p class="mono dim">Commission</p>'+
          '<h1 class="title">Juan Carlos Feo</h1>'+
          '<span class="rule"></span>'+
          '<p>'+(now?('Now: '+esc(now.label)):'Delivered')+'<br><span class="dim">'+done+' of '+total+' stages done'+dueText()+'</span></p>'+
          '<ul class="rows">'+
            field('title','Title','Untitled')+
            field('size','Size','Not set')+
            field('medium','Medium','Not set')+
            field('deadline','Deadline','Not set')+
            field('price','Price','Not set')+
          '</ul>'+
          '<p class="dim">Left: the aesthetic he chose.</p>'+
        '</aside>'+
      '</section>'+


      '<section class="brief">'+
        '<div class="brief-head"><h2 class="title">The brief</h2><p class="label dim">His answers</p></div>'+
        item('Symbolism',
          '<p class="statement">Open. Above all the noise of the day to day. Elevated. Flowy.</p>')+
        item('Time of day',
          '<p class="statement">Sunset.</p>')+
        item('Palette',
          '<p class="statement">Yellow, blue, green, white, black.</p>'+
          '<div class="swatches">'+HIS.map(function(h){return '<div class="swatch"><b style="background:'+h[1]+'"></b><span class="mono">'+h[0]+'</span><span class="mono dim">'+h[1]+'</span></div>';}).join('')+'</div>'+
          '<p class="label dim" style="margin-top:1.6rem">Sampled from the reference</p>'+
          '<div class="swatches small">'+REF.map(function(h){return '<div class="swatch"><b style="background:'+h+'" title="'+h+'"></b><span class="mono dim">'+h+'</span></div>';}).join('')+'</div>')+
        item('If it were a song',
          '<p class="statement">Smooth, cool vibe.</p><ul class="songs">'+SONGS.map(function(s){return '<li><span>'+esc(s[0])+'</span><span>'+esc(s[1])+'</span></li>';}).join('')+'</ul>')+
        item('Cruising speed',
          '<p class="statement">Vibin’ top down at 85 mph.</p>'+gauge())+
        item('Squirtle, Charmander or Bulbasaur',
          '<p class="statement">Bulbasaur.</p>')+
        item('One word from a stranger',
          '<p class="statement">Sick / ¡chingón, wey!</p>')+
      '</section>'+

      '<section>'+
        '<div class="brief-head"><h2 class="title">Production</h2><p class="label dim">'+done+' / '+total+'</p></div>'+
        '<div class="progress"><span class="rule" style="width:'+(done/total*100).toFixed(1)+'%;--full:'+(done?(total/done*100).toFixed(1):100)+'%"></span></div>'+
        '<ol class="steps">'+S.stages.map(function(s,i){
          var cls='step'+(s.done?' done':'')+(now&&now.id===s.id?' now':'');
          var st=s.done?esc(s.date):(now&&now.id===s.id?'Now':'');
          return '<li><button class="'+cls+'" data-stage="'+i+'"'+dis+' aria-pressed="'+s.done+'">'+
            '<span class="mono dim">'+(i<9?'0':'')+(i+1)+'</span><span class="name">'+esc(s.label)+'</span><span class="mono dim state">'+st+'</span></button></li>';
        }).join('')+'</ol>'+
      '</section>'+

      ((writable||S.notes)?'<section class="notes" style="display:grid;gap:1rem">'+
        '<div class="brief-head" style="margin:0"><h2 class="title">Notes</h2>'+(writable?'<p class="label dim">Saved when you click away</p>':'')+'</div>'+
        (writable?'<textarea id="notes" placeholder="Feedback, materials, ideas">'+esc(S.notes)+'</textarea>'
          :'<div class="ro">'+esc(S.notes)+'</div>')+
      '</section>':'')+
    '</div>';
    wire();
  }

  function field(k,label,ph){
    return '<li><label class="label dim" for="f-'+k+'">'+label+'</label><input id="f-'+k+'" data-field="'+k+'" value="'+esc(S.fields[k])+'" placeholder="'+esc(ph)+'"'+(writable?'':' disabled')+'></li>';
  }
  function setSave(t){var el=document.getElementById('save'); if(el) el.textContent=t;}

  function wire(){
    root.querySelectorAll('[data-stage]').forEach(function(b){
      b.addEventListener('click',function(){
        var s=S.stages[+b.dataset.stage]; s.done=!s.done; s.date=s.done?today():'';
        render(); queueSave(1500);
      });
    });
    root.querySelectorAll('[data-field]').forEach(function(inp){
      inp.addEventListener('change',function(){S.fields[inp.dataset.field]=inp.value.trim(); queueSave(300);});
    });
    var n=document.getElementById('notes');
    if(n) n.addEventListener('change',function(){S.notes=n.value; queueSave(300);});
    var file=document.getElementById('file'), pick=document.getElementById('pick'), drop=document.getElementById('drop');
    if(pick) pick.addEventListener('click',function(){file.click();});
    file.addEventListener('change',function(){if(file.files[0]) loadImage(file.files[0]);});
    drop.addEventListener('dragover',function(e){if(!writable) return; e.preventDefault(); drop.classList.add('drag');});
    drop.addEventListener('dragleave',function(){drop.classList.remove('drag');});
    drop.addEventListener('drop',function(e){e.preventDefault(); drop.classList.remove('drag'); if(writable&&e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);});
  }

  function loadImage(f){
    if(!/^image\//.test(f.type)){setSave('That file is not an image. Choose a JPG or PNG.'); return;}
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var sc=Math.min(1,1300/Math.max(img.width,img.height)), c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        S.image=c.toDataURL('image/jpeg',.84);
        render(); queueSave(200);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(f);
  }

  function buildDoc(){
    var close='</'+'script>';
    return '<!doctype html>\n<title>Juan Carlos Commission</title>\n'+
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Karla:wght@300;400;700&display=swap">\n'+
      '<style id="css">'+document.getElementById('css').textContent+'</style>\n'+
      '<script type="application/json" id="state">'+JSON.stringify(S).replace(/</g,'\\u003c')+close+'\n'+
      '<div id="root"></div>\n'+
      '<script id="app">'+document.getElementById('app').textContent+close+'\n';
  }

  function queueSave(ms){
    if(!art){setSave(writable?'Saving works on the published page only':''); return;}
    setSave('Saving…');
    clearTimeout(pending);
    pending=setTimeout(function(){
      art.publish(buildDoc()).then(function(){setSave('Saved');}).catch(function(e){
        var code=e&&e.code;
        if(code==='conflict'){setSave('Updated elsewhere. Reloading…'); return;}
        if(['not_writer','not_granted','not_declared','consent_required','capability_disabled','capability_removed'].indexOf(code)>-1){writable=false; render(); setSave('View only'); return;}
        if(code==='too_large'){setSave('Image too large to save. Try a smaller file.'); return;}
        if(code==='rate_limited'){setSave('Saving too often. Wait a moment, then change something again.'); return;}
        setSave('Could not save. Try again in a moment.');
      });
    },ms);
  }

  render();
  if(window.claude&&window.claude.use){
    window.claude.use('artifact').then(function(a){art=a; if(!a){writable=false; render(); setSave('View only');}});
  }
})();
</script>

</body></html>
