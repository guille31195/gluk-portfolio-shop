<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Juan Carlos — GLUK</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --black:#1e1619;
    --paper:#f1eee8;
    --muted:rgba(241,238,232,.62);
    --line:rgba(241,238,232,.16);
    --orange:#c34f05;
    --blue:#0c89d5;
    --deep:#011458;
    --gutter:clamp(18px,4.5vw,64px);
    --display:'Archivo',system-ui,-apple-system,sans-serif;
    --sans:'Karla',system-ui,-apple-system,sans-serif;
    --ease:cubic-bezier(.77,0,.18,1);
  }
  *{box-sizing:border-box;}
  html{background:var(--black);}
  body{
    margin:0;
    background:var(--black);
    color:var(--paper);
    font-family:var(--sans);
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:clip;
  }
  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:
      radial-gradient(70% 55% at 0% 100%, rgba(195,79,5,.22), transparent 65%),
      radial-gradient(60% 50% at 100% 0%, rgba(1,20,88,.55), transparent 70%);
  }
  h1,h2,p,figure{margin:0;}
  .page{padding-inline:var(--gutter);}
  .top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    height:88px;
  }
  .logo{height:22px;width:auto;display:block;opacity:.92;}
  .eyebrow{
    font-weight:600;
    font-size:12px;
    line-height:1.3;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* Hero: ordered grid, one rupture */
  .hero{
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,5fr) minmax(0,7fr);
    align-items:center;
    min-height:calc(100svh - 88px);
    padding-block:8px 48px;
  }
  .name{
    position:relative;
    z-index:2;
    grid-column:1;
    grid-row:1;
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(52px,10.5vw,176px);
    line-height:.88;
    letter-spacing:-.01em;
    text-transform:uppercase;
    white-space:nowrap;
    text-shadow:0 2px 30px rgba(0,0,0,.45);
    animation:rise 1.1s var(--ease) .15s both;
  }
  .name span{display:block;}
  .name span:last-child{position:relative;}
  .name span:last-child::after{
    content:'';
    position:absolute;
    left:calc(-1 * var(--gutter));
    width:100vw;
    bottom:-.06em;
    height:5px;
    background:url(/brand/rupture-rule.webp) center/cover no-repeat;
    transform-origin:left center;
    animation:draw 1.6s var(--ease) 1.2s both;
  }
  .figure{
    grid-column:2;
    grid-row:1;
    justify-self:end;
    width:min(calc(100% + var(--gutter)), calc((100svh - 120px) * .728));
    margin-right:calc(-1 * var(--gutter));
    aspect-ratio:1332/1830;
    position:relative;
    animation:open 2.1s var(--ease) .35s both;
  }
  .figure img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:zoom-in;
    box-shadow:0 40px 100px rgba(0,0,0,.6);
    animation:settle 2.6s var(--ease) .35s both;
  }
  .rupture{display:none;}
  @keyframes open{from{clip-path:inset(100% 0 0 0);}to{clip-path:inset(0 0 0 0);}}
  @keyframes settle{from{transform:scale(1.08);}to{transform:scale(1);}}
  @keyframes rise{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}
  @keyframes draw{from{transform:scaleX(0);}to{transform:scaleX(1);}}

  /* Wall label */
  .meta{
    display:grid;
    grid-template-columns:repeat(3,auto);
    justify-content:space-between;
    gap:12px 24px;
    border-top:1px solid var(--line);
    padding-block:22px;
  }
  .meta p{font-size:15px;color:var(--muted);}
  .meta p strong{display:block;font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper);margin-bottom:2px;}

  /* Process */
  .process{
    border-top:1px solid var(--line);
    padding-block:clamp(36px,6vw,80px);
  }
  .process[hidden]{display:none;}
  .process h2{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(34px,6vw,84px);
    line-height:1;
    text-transform:uppercase;
    margin-bottom:clamp(20px,3vw,36px);
  }
  .process video{
    display:block;
    width:100%;
    max-height:82svh;
    background:#000;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  }

  .thanks{
    border-top:1px solid var(--line);
    padding-block:clamp(56px,9vw,120px);
  }
  .thanks p{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(34px,6.4vw,92px);
    line-height:1;
    text-transform:uppercase;
    text-wrap:balance;
  }
  .thanks p span{color:var(--orange);}
  .foot{
    border-top:1px solid var(--line);
    padding-block:28px 40px;
    display:flex;
    justify-content:space-between;
    gap:14px 24px;
    flex-wrap:wrap;
    color:var(--muted);
    font-size:13px;
    letter-spacing:.03em;
  }
  .foot a{color:var(--muted);text-decoration:none;}

  /* Zoom */
  .zoom{
    position:fixed;
    inset:0;
    z-index:70;
    background:rgba(14,10,11,.97);
    display:flex;
    overflow:auto;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    cursor:zoom-out;
  }
  .zoom.open{opacity:1;pointer-events:auto;}
  .zoom img{max-width:none;width:min(200vw,1500px);display:block;margin:auto;}

  @media (max-width:820px){
    .hero{grid-template-columns:minmax(0,1fr);align-items:start;gap:28px;min-height:0;padding-block:12px 36px;}
    .name{grid-column:1;grid-row:1;font-size:clamp(52px,17vw,120px);}
    .figure{
      grid-column:1;
      grid-row:2;
      width:calc(100% + var(--gutter) * 2);
      margin-inline:calc(-1 * var(--gutter));
    }
    .name span:last-child::after{display:none;}
    .rupture{
      display:block;
      position:absolute;
      left:calc(-1 * var(--gutter));
      right:calc(-1 * var(--gutter));
      bottom:36px;
      height:5px;
      background:url(/brand/rupture-rule.webp) center/cover no-repeat;
      pointer-events:none;
    }
    .meta{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){
    .name,.figure,.figure img,.name span:last-child::after{animation:none!important;}
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <img class="logo" src="img/wordmark-white.png" alt="GLUK">
    <span class="eyebrow">Commission · 2026</span>
  </header>

  <section class="hero">
    <h1 class="name"><span>Juan</span><span>Carlos</span><span>Feo</span></h1>
    <figure class="figure">
      <img id="art" src="img/painting.jpg" alt="Oil painting: a surfer seated on his board against a yellow wall, between blue, red and burgundy planes, with a framed sky above and the sea beyond" width="1332" height="1830">
    </figure>
    <span class="rupture" aria-hidden="true"></span>
  </section>

  <div class="meta">
    <p><strong>Artist</strong>GLUK (Guillermo Carrasquero)</p>
    <p><strong>Medium</strong>Oil on canvas</p>
    <p><strong>Year</strong>2026</p>
  </div>

  <section class="process" id="process" hidden>
    <h2>Process</h2>
    <video id="vid" controls playsinline preload="metadata" poster="img/painting.jpg">
      <source src="process.mp4" type="video/mp4">
    </video>
  </section>

  <section class="thanks">
    <p>Thank you, <span>Juan Carlos.</span></p>
  </section>

  <footer class="foot">
    <span>GLUK — Oil, ink and code</span>
    <a href="https://glukart.com">glukart.com</a>
  </footer>
</div>

<div class="zoom" id="zoom" aria-hidden="true"><img src="img/painting.jpg" alt=""></div>

<script>
  var zoom=document.getElementById('zoom');
  document.getElementById('art').addEventListener('click',function(){zoom.classList.add('open');});
  zoom.addEventListener('click',function(){zoom.classList.remove('open');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')zoom.classList.remove('open');});
  // The process section appears only when the video file exists.
  var vid=document.getElementById('vid'),proc=document.getElementById('process');
  vid.addEventListener('loadedmetadata',function(){proc.hidden=false;});
</script>
</body>
</html>
